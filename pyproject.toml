[project]
name = "reviewpilot"
version = "0.1.0"
description = "A LangGraph code review agent that reviews pull requests and comments on GitHub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-anthropic",
    "pydantic",
    "httpx",
    "python-dotenv",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "sse-starlette>=3.7.0",
]

[project.scripts]
reviewpilot = "reviewpilot.cli:main"

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (skipped unless RUN_LIVE=1)"]
